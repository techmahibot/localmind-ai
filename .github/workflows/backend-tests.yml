name: Backend tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: localmind
          POSTGRES_PASSWORD: localmind
          POSTGRES_DB: localmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localmind -d localmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://localmind:localmind@127.0.0.1:5432/localmind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
